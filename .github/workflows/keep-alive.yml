name: Keep-alive ping (Mulin IBE backend)

# Pings the booking backend every 5 minutes so the Render instance stays
# warm. Without this, the free-tier service spins down after ~15 min idle
# and the first guest request hits a ~30-50s cold start, which the booking
# UI surfaces as "Unser Buchungsserver startet gerade …". Hosted in this
# public repo so GitHub Actions minutes are free/unlimited.

on:
  schedule:
    # Every 5 minutes (GitHub adds ~1-3 min jitter → effective 5-8 min,
    # comfortably below Render's ~15 min idle spin-down).
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - name: Ping backend /health
        env:
          URL: https://amanthos-website-api-v2.onrender.com/health
        run: |
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 --retry 3 --retry-delay 5 "$URL" || echo "000")
          echo "HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "::warning::Backend health check returned $HTTP"
          fi
