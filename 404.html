<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite nicht gefunden | Hotel Mulin Brigels</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="./assets/images/logo-white.png">
  <meta name="theme-color" content="#22302a">

  <!-- Bewusst eigenstaendig gestaltet statt ueber css/style.min.css: Eine Fehlerseite
       muss auch dann noch lesbar sein, wenn genau das Stylesheet fehlt, das den
       Fehler verursacht hat. Schriften liegen lokal im Repo, kein externer Abruf. -->
  <style>
    @font-face{font-family:'Inter';font-style:normal;font-weight:400 700;font-display:swap;src:url(./assets/fonts/Inter.woff2) format('woff2')}
    @font-face{font-family:'Playfair Display';font-style:normal;font-weight:400 700;font-display:swap;src:url(./assets/fonts/PlayfairDisplay.woff2) format('woff2')}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FAF8F5;
      color: #2C2C2C;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      line-height: 1.6;
    }
    .wrapper { max-width: 480px; }
    .code {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 4rem;
      color: #2F4A3C;
      line-height: 1;
      margin-bottom: .75rem;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 400;
      color: #2C2C2C;
      margin-bottom: 1rem;
    }
    p { color: #2C2C2C; margin-bottom: 2rem; }
    .home {
      display: inline-block;
      background: #2F4A3C;
      color: #FFFFFF;
      padding: .85rem 2rem;
      border-radius: 2px;
      text-decoration: none;
      font-size: .95rem;
      letter-spacing: .02em;
    }
    .home:hover, .home:focus { background: #22302a; }
    .kontakt { margin-top: 2rem; font-size: .9rem; }
    /* Unterstrichen, nicht nur eingefaerbt: Ein Verweis, der sich allein durch die
       Farbe abhebt, ist fuer farbfehlsichtige Leser keiner. */
    .kontakt a { color: #2F4A3C; text-decoration: underline; }
  </style>

  <!-- Sentry: error + performance monitoring. Config in js/sentry-init.js -->
  <script src="https://browser.sentry-cdn.com/10.68.0/bundle.tracing.replay.min.js"
          integrity="sha384-XaWdQ+280/sFZD3fFzNgO2vpH3FjdOqMQiQBMoyG5itU99/FvV8v4lrmQNIF4Mau"
          crossorigin="anonymous" defer></script>
  <script src="./js/sentry-init.js" defer></script>

  <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.io/js/pa-wxH1rs3S-BhPL7vkG6M0Q.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>
  <script>
    // Plausible zaehlt Fehlerseiten nicht von allein, deshalb hier von Hand.
    // Nur der Pfad, nie die volle URL: Query-Parameter koennen Namen oder
    // Buchungsnummern enthalten.
    plausible('404', { props: { path: location.pathname } });
  </script>
</head>
<body>

  <main class="wrapper">
    <div class="code">404</div>
    <h1>Diese Seite gibt es nicht</h1>
    <p>Der Link ist veraltet oder es hat sich ein Tippfehler eingeschlichen.</p>
    <a class="home" href="/">Zur Startseite</a>
    <p class="kontakt">
      Sie suchen etwas Bestimmtes? Schreiben Sie uns an
      <a href="mailto:mulin@amanthos.com">mulin@amanthos.com</a>
      oder rufen Sie an: <a href="tel:+41415627662">+41 41 562 76 62</a>
    </p>
  </main>

</body>
</html>
